<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Software-patents — 目錄與說明</title>
  <link rel="stylesheet" href="assets/style.css">
  <meta name="referrer" content="no-referrer">
</head>
<body>
  <header>
    <h1>Software-patents</h1>
    <p class="subtitle">網站目錄與 README（自動更新）</p>
    <nav>
      <a href="https://cjs930.github.io/Software-patents/" target="_blank">網站首頁</a>
    </nav>
  </header>

  <main class="container">
    <aside id="sidebar">
      <h2>目錄</h2>
      <div id="file-list">載入中…</div>
    </aside>

    <section id="content">
      <h2>README</h2>
      <div id="readme">載入 README.md…</div>
    </section>
  </main>

  <footer>
    <small>自動由 GitHub 倉庫讀取內容 — 資料來源: cjs930/Software-patents</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const owner = 'cjs930';
    const repo = 'Software-patents';
    const branch = 'main';
    const siteBase = 'https://cjs930.github.io/Software-patents/';

    async function fetchContents(path = ''){
      const api = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;
      const res = await fetch(api);
      if(!res.ok) throw new Error('無法取得目錄');
      return res.json();
    }

    function createListItem(item){
      const el = document.createElement('div');
      el.className = 'item ' + item.type;
      const name = document.createElement('span');
      name.textContent = item.name;
      el.appendChild(name);

      const link = document.createElement('a');
      link.textContent = '開新頁';
      link.target = '_blank';
      if(item.type === 'dir'){
        // link to the site directory (assumes gh-pages serves)
        link.href = siteBase + item.path + '/';
      } else {
        link.href = siteBase + item.path;
      }
      el.appendChild(link);
      return el;
    }

    async function renderFileList(){
      const listContainer = document.getElementById('file-list');
      listContainer.innerHTML = '';
      try{
        const items = await fetchContents('');
        // sort: dirs first, then files
        items.sort((a,b)=> (a.type===b.type? a.name.localeCompare(b.name) : (a.type==='dir'?-1:1)));
        items.forEach(item=>{
          const li = createListItem(item);
          listContainer.appendChild(li);
        });
      }catch(err){
        listContainer.textContent = '載入目錄失敗: ' + err.message;
      }
    }

    async function renderReadme(){
      const target = document.getElementById('readme');
      try{
        const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/README.md`;
        const r = await fetch(rawUrl);
        if(!r.ok) throw new Error('無法取得 README.md');
        const md = await r.text();
        const html = marked.parse(md);
        target.innerHTML = html;
        // convert relative links to open in new tab and point to siteBase when appropriate
        const anchors = target.querySelectorAll('a');
        anchors.forEach(a=>{
          const href = a.getAttribute('href');
          if(!href) return;
          if(href.startsWith('http')){
            a.target = '_blank';
            return;
          }
          // relative -> point to site
          a.href = siteBase + href.replace(/^\.\//,'');
          a.target = '_blank';
        });
      }catch(err){
        target.textContent = '載入 README 失敗: ' + err.message;
      }
    }

    // 初始載入
    renderFileList();
    renderReadme();
  </script>
</body>
</html>
